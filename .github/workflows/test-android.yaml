name: Android tests
# The Kotlin of android/ on the JVM with JUnit, against Capacitor's Android library from node_modules. Then the example app
# built with the plugin installed the way an app installs it, next to io-anyline-cordova, which brings the Anyline SDK.
# No emulator: replaying a scan needs an Anyline licence key.
# Called by ci.yaml when something it covers changes, and for every push to main.
on:
  workflow_call:
jobs:
  # The plugin library built (debug and release, with lint) and its JUnit tests run. Capacitor 8 builds with Java 21.
  jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6.4.1
      # settings.gradle takes capacitor-android from node_modules
      - run: npm ci
      - run: npm run verify:android
      - name: Keep the test report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-report-android
          path: android/build/reports/tests
          if-no-files-found: ignore
  # The plugin as an app sees it: the example app installs it from the repository (file:..), `cap sync` registers it, and
  # Gradle builds a debug APK. Then the one Anyline SDK: the APK carries the SDK's classes once, from io-anyline-cordova.
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6.4.1
      - run: npm ci
      - run: npm run build
      - run: npm run example:android:build
      - name: The plugin is registered in the app
        run: grep -q 'io.github.maximbelov.anylineframereplay.AnylineFrameReplayPlugin' example-app/android/app/src/main/assets/capacitor.plugins.json
      - name: The app carries one copy of the Anyline SDK
        run: |
          apk=example-app/android/app/build/outputs/apk/debug/app-debug.apk
          dexdump=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)dexdump
          dir=$(mktemp -d)
          unzip -q -o "$apk" 'classes*.dex' -d "$dir"
          copies=$(for dex in "$dir"/classes*.dex; do "$dexdump" "$dex"; done | grep -c "Class descriptor  : 'Lio/anyline2/di/camera/CustomCameraInterfaceProvider\$Factory;'" || true)
          echo "definitions of the SDK's camera factory in the APK: $copies"
          [ "$copies" = "1" ]
          plugin=$(for dex in "$dir"/classes*.dex; do "$dexdump" "$dex"; done | grep -c "Class descriptor  : 'Lio/github/maximbelov/anylineframereplay/AnylineFrameReplayPlugin;'" || true)
          echo "definitions of the plugin in the APK: $plugin"
          [ "$plugin" = "1" ]
