# The pins this repository carries, moved by Dependabot: the npm toolchain (Capacitor included), the Gradle build of
# android/, the Swift packages that Package.swift names, and the actions the workflows use. The Anyline SDK is not
# moved here: the app decides its version (iOS: from the lower bound in Package.swift; Android: compileOnly, see
# android/build.gradle).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      capacitor:
        patterns: ['@capacitor/*']
      tooling:
        patterns: ['*']
        exclude-patterns: ['@capacitor/*']
    ignore:
      # TypeScript 7 is the native compiler and has no JavaScript API, which typescript-eslint needs: its peer range
      # stops below 6.1. Lift this when typescript-eslint supports 7.
      - dependency-name: typescript
        versions: ['>=6.1.0']
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
  - package-ecosystem: swift
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
