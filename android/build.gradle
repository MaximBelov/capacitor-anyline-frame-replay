ext {
    junitVersion = project.hasProperty('junitVersion') ? rootProject.ext.junitVersion : '4.13.2'
    androidxAppCompatVersion = project.hasProperty('androidxAppCompatVersion') ? rootProject.ext.androidxAppCompatVersion : '1.7.1'
    // The Anyline SDK is compiled against, not shipped: the app's Anyline wrapper (io-anyline-cordova) brings it, and
    // its version is the one in the APK. An app can name the version it uses as `anylineSdkVersion` in variables.gradle.
    anylineSdkVersion = project.hasProperty('anylineSdkVersion') ? rootProject.ext.anylineSdkVersion : '56.6.0'
}

buildscript {
    ext.kotlin_version = project.hasProperty("kotlin_version") ? rootProject.ext.kotlin_version : '2.2.20'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.5.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace = "io.github.maximbelov.anylineframereplay"
    compileSdk = project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 36
    defaultConfig {
        minSdkVersion project.hasProperty('minSdkVersion') ? rootProject.ext.minSdkVersion : 26
        targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 36
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lintOptions {
        abortOnError = false
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
}

kotlin {
    jvmToolchain(21)
}

repositories {
    google()
    mavenCentral()
    // Where Anyline publishes the SDK.
    maven { url 'https://mobile-sdk-android.anyline.io/release/' }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':capacitor-android')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    // compileOnly: one copy of the SDK in the app, the wrapper's. Nothing of it is packaged from here.
    compileOnly "io.anyline:anylinesdk:$anylineSdkVersion"
    testImplementation "junit:junit:$junitVersion"
    // Android's own org.json is a stub on the JVM; the tests read real JSON.
    testImplementation 'org.json:json:20260814'
}
